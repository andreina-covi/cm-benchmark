# Quality-affecting generation parameters. One file is the source of truth.
# justification tags: literature / calibrated / derived / none found
# (same tags as docs/parameters_report.md). Do not invent a source.
name: default

visibility:
  # Path to the DecisionTree bundle; empty = search defaults / env.
  model_path: null  # calibrated: fit_thresholds.py on human labels
  proba_low: 0.3  # none found (b6fc1ca); fallback when a bundle has no band
  proba_high: 0.7  # none found (b6fc1ca)
  degenerate_band_half_width: 0.05  # none found ("small margin" around a one-point band)
  # Hard floor for every named object (target, landmark, PT A/B/C, receptacle,
  # displaced prop), applied with or without the DecisionTree.
  named_min_frame_fraction: 0.01  # calibrated: review round 1 (43 MC items); wrong rate 0.74 below vs 0.49 above; ReVSI uses 0.05
  # Share of a named object's unoccluded projected box inside the frame (SPOC
  # in-frame-fraction), in the frame where it is named. Target 0.5 (MindEdit-Bench
  # visible > 0.50; Long Time No See: half of the footprint inside the view), with a
  # 0.05 tolerance band so 0.45-0.50 still passes (user decision 2026-11-18).
  # Collections without the column skip this check.
  named_min_in_frame_fraction: 0.45
  static:
    min_bbox_area: 100.0  # none found (b418bda; drop speck detections)
    min_side: 8.0  # none found (b418bda)
    min_visible_pixels: 40.0  # none found (b418bda)
    min_occupancy_ratio: null
    max_obj_distance: null
  query:
    min_bbox_area: 1200.0  # none found (c87ae77 raised from 800; fallback only)
    min_side: 32.0  # none found (c87ae77 raised from 24)
    min_visible_pixels: 300.0  # none found (c87ae77 raised from 200)
  border:
    edge_margin_px: 2  # none found (c87ae77; geometric clip rule)
    min_extent_if_clipped_px: 48.0  # none found (c87ae77)
  id_encode:
    min_bbox_area: 100.0  # none found (5c7eb3c; soft bar for small displaced props)
    min_side: 8.0  # none found (5c7eb3c)
    min_visible_pixels: 40.0  # none found (5c7eb3c)

directions:
  ahead_half_width_fov_deg: 20.0  # none found (d56b883; 45° collapses FOV objects to ahead)
  ahead_half_width_full_deg: 45.0  # derived: four equal 90° sectors; behind boundary = 135°
  pt_back_deg: 135.0  # literature: VSI-Bench relative direction, back = turn ≥ 135°
  # Perspective taking uses the same four 90° sectors as spatial updating: ahead
  # within ±ahead_half_width_full_deg of A->B, left / right up to pt_back_deg,
  # behind beyond it; a triple within this margin of any edge gives no label.
  pt_boundary_margin_deg: 10.0  # none found (c87ae77; not a published VSI/ViewSpatial constant)
  refuse_straddling_objects: true  # derived: drop when 2D bbox edges (visible) or AABB corners (hidden) span >1 sector; ang-width fallback
  label_margin_deg: 10.0  # calibrated: round-1 review, human acc 13% (<5°) / 45% (5-10°) / 54-62% (≥10°) by distance to the nearest sector edge; every extent bearing must be this far from an edge

options:
  n_options: 4  # derived: four ego labels
  n_options_visible: 3  # derived: an object in the shown frame is never "behind you" (VSI-Bench easier levels drop back)
  shuffle_seed: 0  # none found; one seed, a different permutation per item
  max_label_share: 0.4  # none found; at most this share of one construct's items, over the whole set, may share an answer label

disambiguation:
  proximity_setting: current  # none found; ablation: sr3d / vsi / current / strict
  all_marks: false  # true = numbered marks only (ablation reference)
  ratio_2d: 1.5  # none found; sibling 2D gap must be ≥ this × target gap
  min_gap_2d_frac: 0.10  # none found; plus this fraction of image width
  mark_max_ids: 7  # none found; numbers 1..n (seeded permutation) go only to instances in the item's shown frames; skip the type if those frames have more instances than this
  mark_radius_frac: 0.02  # none found; badge radius as a fraction of image width (≈8 px at 396 px), kept small so it hides little of a 1%-floor object
  mark_min_radius_px: 7  # none found; smallest radius at which a digit stays legible
  settings:
    current:
      margin_m: 0.6  # none found (b418bda; "obvious in the image")
      ratio: 1.5  # none found (b418bda)
    sr3d:
      margin_m: 0.20  # literature: ReferIt3D Sr3D horizontal_gap
      ratio: null
    vsi:
      margin_m_small: 0.15  # literature: VSI-Bench, rooms ≤ room_area_split_m2
      margin_m_large: 0.30  # literature: VSI-Bench, rooms larger than the split; also the fallback when region area is not exported
      room_area_split_m2: 40.0  # literature: VSI-Bench room-area split; exported regions have no area, so the large margin is used
      ratio: null
    strict:
      margin_m: 1.0  # none found (upper bound)
      ratio: 2.0

budget:
  max_per_construct: 3  # none found
  max_per_scene: 2  # none found; concise facts taken from one scene before the cross-scene round-robin
  candidate_pool: 24  # none found; facts gathered before the label/letter cut

spatial_working_memory:
  min_delay: 2  # none found
  max_delay: null  # derived cap: (max(frames.budgets) - 1) * frames.max_gap_steps (155); a longer span fits no budget
  delay_steps: [2, 5, 10, 20]  # none found; sample k from this set when the episode has it
  count_divisor: 3  # none found (5c7eb3c; max(1, max_items // divisor))
  count_min_instances: 2  # derived: n=1 has no memory load

spatial_updating:
  min_delay: 2  # none found
  max_delay: null  # derived cap: (max(frames.budgets) - 1) * frames.max_gap_steps (155); a longer span fits no budget
  delay_steps: [2, 5, 10, 20]  # none found; sample k from this set when the episode has it
  min_pos_change_m: 0.1  # none found (05535fa)
  min_heading_change_deg: 5.0  # none found (05535fa)
  object_static_eps_m: 0.05  # none found (05535fa)

motion:
  position_eps_m: 0.001  # derived: float noise, far below the 0.20 m step

invisible_displacement:
  floor_anchor_radius_m: 1.2  # none found (05535fa); unused when placement CSV has radius_m
  min_displacement_m: 0.5  # none found; reject placements closer than this
  # The landmark that names the destination (receptacle, or the landmark a floor
  # spot is "near") must be at least this far (AABB gap, XZ) from the object's old
  # box, so "moved onto / near Y" is never Y the object was already on or beside.
  # Long Time No See names counter areas by nearby landmarks for the same reason.
  min_landmark_gap_m: 0.5
  min_diagnostic_labels: 2  # derived: invariant 7 (at least one diagnostic distractor)
  # The answer must depend on the move: at the query step the object's old box and
  # its new box each get an ego label clear of directions.label_margin_deg, and the
  # two labels differ, so answering with the old location (A-not-B) is wrong.
  # min_displacement_m alone does not ensure it (0.5 m at 4 m is about 7 deg).
  require_label_change: true  # derived: answer must depend on the move
  max_delay: 10  # none found; earliest query after encode, dest has no mask pixels

landmarks:
  layout_base: 2.0  # none found (05535fa; layout salience boost)
  layout_per_sighting: 0.1  # none found (05535fa)
  other_base: 1.0  # none found (05535fa)
  other_per_sighting: 0.05  # none found (05535fa)
  top_n_per_region: 5  # none found (05535fa)
  max_total: 40  # none found (05535fa)

perspective_taking:
  top_n_per_region: 4  # none found (05535fa)
  max_total: 18  # none found (05535fa)
  # Points per axis sampled over A's, B's and C's floor boxes (3 = corners, edge
  # midpoints, centre). The answer must not flip for any (A, B, C) point combination,
  # so "standing next to A", "facing B" (a long countertop swings A->B by 30 deg or
  # more) and "where is C" hold wherever on A, B or C one imagines it.
  # Calibrated on round 1: the 4 reviewed items whose label flips (TV stand facing
  # its television, objects resting on A) scored 1/16; the 6 stable ones 5/10.
  footprint_grid: 3  # none found
  # AABB gap between every pair of A, B, C. VSI-Bench (VLM-3R relative-direction
  # scripts) uses 0.30-5.0 m; round-7 review found a 0.36 m pair confusing, so the
  # minimum is 0.5 m (keeps 84 of 98 round-7 items; user decision 2026-11-18).
  min_pair_gap_m: 0.5
  max_pair_gap_m: 5.0
  # Angular disparity = angle between the imagined heading (A->B) and the camera
  # heading in the shown frame, 0-180 deg. Edges split it into bins (bin index is
  # the item's `difficulty`); triples are drawn round-robin over (answer label,
  # bin), emptiest group first. Spatial Orientation Test (Hegarty & Waller 2004;
  # Kozhevnikov & Hegarty 2001): error grows with this angle; 45-deg bins.
  disparity_bin_edges_deg: [45.0, 90.0, 135.0]
  # Bin 0 (disparity < first edge) is the control: the imagined heading is close to
  # the camera's. Kept, but capped at this share of the final perspective-taking set
  # (whole-set balance); headline accuracy is reported on the other bins.
  max_control_share: 0.2  # none found; reviewer feedback 2026-11-20
  # A must stand on the floor (SPOC salient_landmarks) and the question says
  # "standing next to the {A}". A's stability points are its centre plus a ring this
  # wide on the half of A facing B (user decision 2026-11-20: one-sided; the full
  # ring removed every "behind" answer in Round 2).
  a_standoff_m: 0.5  # none found; reviewer feedback 2026-11-20
  # Max items in one scene that use the same object as A (the stand-at landmark), so
  # one landmark ("House Plant") does not become a learnable cue.
  max_uses_as_a: 2  # none found; reviewer feedback 2026-11-20
  # false: A, B and C must be distinguishable together in one frame. true: they may be
  # seen in different frames; the item shows every frame of the shortest window that
  # holds one sighting of each (whole, within the largest frames.budgets), and stores
  # abc_co_visible so the two kinds can be compared. Disparity uses the last frame.
  multi_frame: true  # user decision 2026-11-20: kept (Round 2: 56 of 59 items need it)
  # Frame continuity for multi-frame items: consecutive shown frames must overlap,
  # i.e. differ by at most one turn and one move step (SPOC: 45 deg turns, 0.2 m
  # moves), so A, B and C can be chained across frames without a jump.
  continuity_max_turn_deg: 45.0  # derived: one SPOC turn step; user decision 2026-11-20
  continuity_max_move_m: 0.25  # derived: one SPOC move (0.2 m) plus tolerance
  # Multi-frame window: at most this many consecutive frames (no step skipped); a
  # triple whose A, B and C cannot be covered within it is dropped. Among windows
  # that fit, one with a frame showing two of A/B/C together is preferred
  # (`abc_pair_together`), then the shortest. 32 = the largest frames.budgets (user
  # decision 2026-11-20, after trying 8: 39 items vs 63).
  max_window_frames: 32  # derived: max(frames.budgets); user decision 2026-11-20

naming:
  # Display names in questions. Keys are the exported obj-type (Obja prefix
  # stripped). Objaverse types are often the first WordNet lemma, which reviewers
  # did not know (round 1: "lima", "cal", "Silla de Terraza", "Placard", "Icon").
  # Values are everyday names chosen from the obj-synset gloss. Types that map to
  # the same name are confusable, so they are disambiguated like duplicates.
  rename:
    TVStand: TV Stand
    ArmChair: Armchair
    Armchair: Armchair
    CounterTop: Countertop
    Refrigerator: Fridge
    MicrowaveOven: Microwave
    Ashcan: Trash Can
    GarbageCan: Trash Can
    Placard: Poster
    Icon: Picture
    PictorialMatter: Picture
    Framing: Picture Frame
    Waggon: Wagon
    CoasterWagon: Toy Wagon
    Teakettle: Kettle
    Fireplug: Fire Hydrant
    Pickax: Pickaxe
    AutomaticWasher: Washing Machine
    TelephoneSet: Telephone
    Crapper: Toilet
    Cuke: Cucumber
    AlligatorPear: Avocado
    AlliumSativum: Garlic
    BrassicaOleraceaBotrytis: Cauliflower
    Cocoanut: Coconut
    Orangeness: Orange
    Capsicum: Pepper
    Chilli: Chili Pepper
    AlimentaryPaste: Pasta
    Jambon: Ham
    Crisp: Potato Chip
    Poriferan: Sponge
    Membranophone: Drum
    CalculatingMachine: Calculator
    Igniter: Lighter
    Torch: Flashlight
    DarkGlasses: Sunglasses
    Specs: Glasses
    Mag: Magazine
    Volume: Book
    Hardback: Book
    Clayware: Pottery
    Ewer: Pitcher
    Eggwhisk: Whisk
    Swayer: Ruler
    Rule: Ruler
    Pipage: Pipe
    Tubing: Tube
    TransmissionLine: Cable
    Orb: Ball
    Flora: Plant
    Blossom: Flower
    PotPlant: Potted Plant
    Flowerpot: Flower Pot
    CellularTelephone: Cell Phone
    CellPhone: Cell Phone
    WeighingMachine: Scale
    Carryall: Tote Bag
    IceChest: Cooler
    Cannister: Canister
    RegularHexahedron: Cube
    Coatrack: Coat Rack
    Handcart: Hand Cart
    Handbasket: Basket
    Phonebook: Phone Book
    Chiffonier: Dresser
    ChestOfDrawers: Dresser
    Hobbyhorse: Hobby Horse
    BasketBall: Basketball
    GlobalPositioningSystem: GPS Device
    IdentityCard: ID Card
    ShortPants: Shorts
    PairOfPliers: Pliers
    Grapevine: Grapes
    PineapplePlant: Pineapple
    BananaTree: Banana
    MemorialTablet: Plaque
    Brass: Plaque
    TinCan: Can
    TravelingBag: Suitcase
  # Never named (not as target, landmark, receptacle or proximity anchor): the
  # type is a vague hypernym or an abstract label that does not say what the
  # object looks like.
  unnamed: [Machine, Container, Collectible, Toy, Plaything, Tool, Weapon, Figure,
    Clothing, Cloth, Fabric, Game, ComputerGame, Case, Token, Label, Tag, Card,
    Control, Console, Disk, Bow, Club, LightSource, OpticalIllusion, PowderStore,
    Exhibit, Swatch]

frames:
  # Image budgets for multi-frame items (VLM image limits differ by model size).
  # Each item gets one frame list per budget it fits; evaluation uses the model's
  # budget. Required frames (encode, query, turns, class-4 sightings/path covers)
  # are always kept; the rest fill the gaps evenly. Change the list to evaluate
  # larger or smaller VLMs.
  budgets: [16, 24, 32]  # literature: VSI-Bench / MMSI-Bench evaluate the same question at a per-model frame count
  max_gap_steps: 5  # none found; class 4 only (SWM/SU are never sampled): max pool frames between consecutive shown frames, after repeated-pose frames are dropped; a budget that cannot meet it is not offered

class4:
  min_pair_geodesic_m: 2.0  # none found; source–goal path at least 2 m (literature band was 1–30 m)
  max_pair_geodesic_m: 30.0  # literature: HM3D-OVON / GOAT-Bench / HSSD-200 (2024)
  scene_geodesic_percentile: 0.5  # none found (7a2ee6a); survey length floor, and the route/survey detour-ratio floors. Route length uses min_pair_geodesic_m only
  landmark_snap_m: 2.5  # none found (5c7eb3c)
  landmark_snap_default_m: 1.5  # none found (63130d5; unused when landmark_snap_m is set)
  landmark_snap_default_grid_mult: 10.0  # none found (63130d5)
  snap_tolerance_steps: 1.4142135623730951  # derived: √2 · one 8-neighbour step
  goal_success_m: 1.0  # literature: ObjectNav / GOAT success distance 1.0 m
  search_state_quant_m: 0.05  # visited-cell size for continuous BFS; not a pair gate
  move_block_slack_m: 1.0e-6  # derived: added to the calibrated block radius so a pose at that distance is not blocked
  route:
    context_margin_steps: 4  # none found; FOV steps kept before the source sighting and after the goal sighting
    max_ratio_floor: 1.1  # literature: Habitat PointNav rejects geo/eucl < 1.1
    min_hop_count: 2  # none found (5b4cb02; at least one real edge)
    max_subpath_nodes: 512  # none found (274e5ff)
    min_turns: 1  # none found; at least one real turn
    max_turns: 20  # none found; raised from 12 so a recorded walk is not dropped for turn count alone
  survey:
    max_ratio_floor: 1.05  # literature: HSSD-200 (CVPR 2024) geo/eucl < 1.05 is nearly straight
    min_agent_source_dist_m: 1.0  # literature: ObjectNav / GOAT success distance 1.0 m
    view_radius_percentile: 0.5  # none found (5b4cb02)
    min_turns: 1  # none found; at least one real turn
  follower:
    ladder_multipliers: [1.5, 1.0, 1.0, 0.5]  # derived: multiples of max(grid, move) / grid
    arrive_fraction: 0.75  # none found (274e5ff)
    max_actions: 512  # none found (274e5ff)
  fallback:
    grid_size_m: 0.25  # derived: unused when the export supplies grid_size
    agent_rotation_deg: 45.0  # derived: unused when the export supplies rotation
    agent_move_m: null  # derived: unused; falls back to grid_size

# Human review package. Sampling / UI only — does not change item generation.
review:
  # Override per run with: python scripts/build_review_package.py --class4-per-reviewer N
  class4_per_reviewer: 5  # none found; max route+survey study items each reviewer sees
  move_m: 0.2  # derived: same as episode_gt.mov_constant_m; shown on Forward/Back buttons

# Episode-GT hyperparameters. Camera / agent fields are overridden by episode_meta.
episode_gt:
  frame_w: 396  # derived: SPOC nav camera; overridden by episode_meta.camera
  frame_h: 224  # derived: SPOC nav camera
  fov_v_deg: 59.0  # derived: fallback; measured fov_vertical_deg overrides
  k_neighbors: 3  # none found (11d1c8f); object–object edges (allocentric unused)
  radius_m: 1.5  # none found (11d1c8f)
  ey_m: 0.1  # none found (11d1c8f); above/below on episode edges
  ez_m: 0.15  # none found (11d1c8f); skip projection closer than this
  angle_threshold_xz_deg: 15  # none found (11d1c8f); passed then discarded
  min_distance_m: 0.5  # none found (11d1c8f); edge distance_label only
  med_distance_m: 1.0  # none found (11d1c8f)
  max_distance_m: 1.5  # none found (11d1c8f)
  mov_constant_m: 0.2  # derived: fallback; episode_meta.agent.movement_constant overrides
  state_sparsify_eps_m: 0.0001  # derived: float noise for object_state_track
