# Excerpt of configs/taxonomy.yaml. Edit taxonomy first, then re-sync.
egocentric_encoding:
  class: 1
  frame_of_reference: egocentric
  definition: Relation of a visible object to the viewer's current pose.
  what_moves: none
  answer_type: viewer-anchored direction (left/right/ahead/behind/above/below)
  required_temporal_fields: []
  question_template: From your current view, where is the {object} relative to you?
  ground_truth_method: >
    Bearing of a visible object from the current agent pose.
    "Behind you" cannot be the ground-truth answer (FOV); only a distractor.
  distractor_pattern:
    - opposite_direction
    - orthogonal_direction
    - plausible_wrong_axis
  discriminators:
    - queried object is visible in the shown view
    - no delay and no agent movement
    - answer from current pose + object position
