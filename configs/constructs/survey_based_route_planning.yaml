# Auto-synced excerpt from configs/taxonomy.yaml (single source of truth).
# Do not diverge field semantics here; edit taxonomy.yaml then re-sync.
survey_based_route_planning:
  class: 4
  frame_of_reference: allocentric
  definition: 'Infer relative direction and distance between observed landmarks using survey
    (layout) knowledge. The graph path linking them must NEVER have been traversed — answers
    are direction/distance judgments, not turn sequences (those belong to route_knowledge).
    A second, conditional mode tests flexible replanning under a recorded passage closure
    (Tolman''s 1948 blocked-path paradigm).

    '
  what_moves: none required
  answer_type:
    direction_distance: 'direction + distance of landmark B relative to landmark A

      '
    conditional_detour: 'initial direction of travel required to reach B from A on the graph
      with the relevant passage''s nearby edges removed — NOT the raw static bearing; requires
      re-running shortest_path() on the modified graph

      '
  required_temporal_fields:
  - agent_trajectory
  - nav_graph
  - passage_state
  question_template:
    direction_distance: Using your knowledge of the environment's layout, where is the {goal}
      relative to the {source}?
    conditional_detour: Using your knowledge of the environment's layout, where would you
      first head to reach the {goal} from the {source}, given that {condition}?
  ground_truth_method: 'Source/goal selected via select_landmark_candidates() and snapped
    with snap_landmark_to_graph() (nearest navigable node). direction_distance mode: computed
    directly from source/goal positions (no path search for the label); nav_graph only confirms
    the path was never traversed. conditional_detour mode: {condition} comes from a real recorded
    passage_state closure (never invented); ground truth = first_hop_direction_label of shortest_path()
    on nav_graph after remove_edges_near_position(passage).

    '
  distractor_pattern:
  - opposite_direction
  - wrong_distance
  - known_route_answer
  discriminators:
  - queried path/shortcut is absent from agent_trajectory (never directly traversed)
  - 'the connection between {source} and {goal} must have been perceptually evidenced in some
    shown frame — the connecting doorway/passage was visible, or both regions were visible
    with a sightline between them — even though the agent never walked through it. world_layout.connectivity
    truth that was never perceptually available to the agent is NOT sufficient

    '
  - 'conditional_detour mode only: {condition} must correspond to a real passage_state closure
    actually recorded in the episode, never an invented hypothetical

    '
  - 'conditional_detour mode only: answer is the modified-graph initial direction, never a
    full turn sequence (that would duplicate route_knowledge)

    '
