# Excerpt of configs/taxonomy.yaml. Edit taxonomy first, then re-sync.
perspective_taking:
  class: 3
  frame_of_reference: allocentric
  definition: >
    Standing at landmark A, facing B, report where landmark C is.
    Heading is A→B (two positions), not an object's intrinsic front.
  what_moves: observer (imagined; viewpoint adopted, not executed)
  difficulty_axis:
    - perspective_shift_magnitude
  answer_type: direction of landmark C from the imagined viewpoint (standing at A, facing B)
  required_temporal_fields: []
  question_template: >
    Imagine standing at the {A}, facing the {B}. From that position, where is the {C}?
  ground_truth_method: >
    Three distinguishable landmarks A, B, C. Imagined heading is A→B.
    Answer is where C sits in that frame (left / right / behind).
    No object-intrinsic facing is required.
  distractor_pattern:
    - camera_frame_answer
    - mirrored_left_right
    - wrong_facing_assumption
  discriminators:
    - A, B, C are three distinct, distinguishable landmarks
    - the agent does not actually move to A
    - answer is in the imagined (A, A→B) frame, not the camera frame
