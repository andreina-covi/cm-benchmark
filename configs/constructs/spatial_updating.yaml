# Excerpt of configs/taxonomy.yaml. Edit taxonomy first, then re-sync.
spatial_updating:
  class: 3
  frame_of_reference: egocentric
  definition: Update own position/heading after real movement; report a static object's bearing.
  what_moves: observer (real, executed actions)
  answer_type: egocentric direction at the post-move pose
  required_temporal_fields:
    - agent_trajectory
    - agent_actions
    - object_state_track
  question_template: >
    Considering the last {k} navigation steps, where is the {object_type} relative to you now?
  ground_truth_method: >
    Confirm a real pose change (position or heading) between encode and
    query — not action count alone. Object stays put (object_state_track).
    Answer is the object's bearing at the new pose.
  distractor_pattern:
    - pre_move_bearing
    - opposite_turn_bearing
    - over_rotation_bearing
  discriminators:
    - object position unchanged (only the agent moves)
    - net pose change between encode and query — action count is not enough
    - queried object not visible at the final pose
    - answer recomputed from the final pose + object position
