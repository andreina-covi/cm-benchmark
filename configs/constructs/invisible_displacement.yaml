# ============================================================
# GENERATOR CONFIG — Invisible displacement  (Class 2: Spatial memory)
# Discriminators: configs/taxonomy.yaml (single source of truth)
# ============================================================

construct_id: invisible_displacement
class: 2
frame_of_reference: egocentric

task_description: >
  Hidden relocation while the object is out of nav FOV. The question always
  supplies a destination cue: a named receptacle landmark (direct) or a
  previously seen partner object (swap). Answers are egocentric bearings at
  the query pose, computed here from exported poses — never invented.
  Do not ask receptacle names alone (unanswerable if the move was unwitnessed).

modes:
  recall_direction:
    frame_of_reference: egocentric
    when: direct hidden place (moved_via != swap)
    question_templates:
      - >-
        The {object_type} was moved onto {new_location}.
        Where is it relative to you now?
  swap:
    frame_of_reference: egocentric
    when: moved_via == swap with distinguishable swap_partner_id
    question_templates:
      - >-
        The {object_type} was moved to where the {other_object_type} used to be.
        Where is the {object_type} relative to you now?
    note: Never combine with recall_direction on the same row;
      question must not name a receptacle.

source_data:
  displacement_events:
    - event_id, obj_id, at_timestep, from/to_receptacle, from/to_pos
    - hidden_during, FOV flags, moved_via, swap_partner_id, notes
  displacement_candidates:
    - candidate_role, candidate_receptacle, candidate_pos, is_persisted
  object_state, navigation: visibility + distinguishability filter (shared with other constructs)

must_hold:
  - distinguishable sighting → hidden → move while hidden
  - object not in FOV on shown frames from move through query_step t
  - question names destination cue (landmark OR partner)
  - direct: to_receptacle != Floor; landmark distinguishable in ≥1 shown frame
  - swap: partner distinguishable in ≥1 shown frame before swap; swap template only
  - unique option labels per item
