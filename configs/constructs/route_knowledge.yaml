# Auto-synced excerpt from configs/taxonomy.yaml (single source of truth).
# Do not diverge field semantics here; edit taxonomy.yaml then re-sync.
route_knowledge:
  class: 4
  frame_of_reference: egocentric
  definition: Retrace / recall an EXPERIENCED path as an ordered sequence.
  what_moves: observer (along a previously traversed route)
  answer_type: ordered sequence of turns (graded as MCQ over full candidate sequences, not
    free text)
  required_temporal_fields:
  - agent_trajectory
  - agent_actions
  - nav_graph
  question_template: Which of these matches the sequence of turns you made traveling from
    {source} to {goal}?
  ground_truth_method: 'Source/goal are landmarks chosen via select_landmark_candidates()
    (salience-filtered through the visibility classifier, top-N weighted sample per region
    — never nearest-distance, never uniform-random). For route_knowledge each landmark is
    snapped to the nearest *visited* nav_graph node via snap_to_nearest_of(graph, pose, traversed_nodes)
    (naming stays on the landmark; pathfinding uses the node). Candidate path = the real traversed
    node sequence between those nodes. Reject any candidate below a minimum hop count calibrated
    per-scene from that scene''s own distribution of landmark-pair shortest-path lengths (capped
    for MC length) — do not import R2R''s 4-6 edge figure as a fixed target. Correct answer
    = derive_turns() on the traversed node sequence, binned to episode_meta.agent.rotation_deg,
    each turn labeled with its nearest landmark.

    '
  distractor_pattern:
  - reversed_sequence
  - swapped_two_turns
  - plausible_but_unwalked_route
  discriminators:
  - the queried route WAS previously traversed by the agent
  - source and goal are landmarks (region-anchored), never raw graph nodes or arbitrary objects
  - path length >= the scene-calibrated minimum hop count
  - answer requires retrieval of sequential/procedural route information
  - the expected answer preserves the experienced order of turns, actions, or landmarks
  - INVALID if the queried source-goal route was not previously traversed by the agent
  - graded as multiple-choice over full candidate sequences, never free-text (keeps scoring
    deterministic, consistent with the rest of the pipeline)
