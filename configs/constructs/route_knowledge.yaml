# Excerpt of configs/taxonomy.yaml. Edit taxonomy first, then re-sync.
route_knowledge:
  class: 4
  frame_of_reference: egocentric
  definition: Retrace an experienced path as an ordered action sequence.
  what_moves: observer (along a previously traversed route)
  answer_type: >
    ordered sequence of collected navigation actions
    (move_ahead, rotate_left, rotate_right, move_back). Not MCQ.
    [CODE] scores success / validity / SPL on the walked graph.
  required_temporal_fields:
    - agent_trajectory
    - nav_graph
  question_template: >
    List, in order, the navigation actions you took to travel from the
    {source} to the {goal}.
  ground_truth_method: >
    Source and goal are named landmarks on the walked trajectory.
    The path is the shortest walk on traversed_edges. Stored answer is a
    reference action sequence for analysis; scoring is metric simulation.
    Keep only non-trivial walks (length, detour, and real turns); emit
    the hardest surviving pairs. A scene with no such walk is unsupported.
  distractor_pattern: []
  discriminators:
    - the queried route was previously traversed (path on traversed_edges)
    - source and goal are named landmarks, not graph nodes
    - the walk is non-trivial (not a short straight shot)
    - free action sequence; [CODE] scores success / validity / SPL
    - INVALID if that source–goal walk was not previously traversed
