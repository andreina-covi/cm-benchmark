# ============================================================
# taxonomy.yaml  —  configs/taxonomy.yaml
# Single source of truth for the capability axis of the benchmark.
# Every per-construct file under configs/constructs/ for classes 2–4
# (invisible_displacement, spatial_updating, perspective_taking,
# route_knowledge, survey_based_route_planning) is a synced excerpt of the
# matching block below. Prefer editing THIS file, then re-export excerpts.
# Class-1 and spatial_working_memory still use longer generator-style YAMLs.
# Do not redefine construct semantics elsewhere.
# ============================================================

version: 0.1
description: >
  Spatial-cognition QA benchmark for VLMs. Four classes, eight
  constructs, treated as a PARTIALLY-ORDERED pipeline (later classes
  subsume earlier ones; they are not fully independent). Frame of
  reference is a CROSS-CUTTING axis, not a construct.

axes:
  capability: {classes: 4, constructs: 8}      # this file
  frame_of_reference: [egocentric, allocentric] # tagged on every item
analysis_breakdowns: [per_construct, "per_construct_x_frame_of_reference"]

# Rules that hold for EVERY construct (enforced by the pipeline, not
# restated in each construct below).
shared_rules:
  - question text names only the queried object(s) and asks the relation;
    it must never state the answer, a direction, or any move/event
  # EXCEPTION (spatial_working_memory | invisible_displacement, verbose only):
    # may additionally name other static, non-queried objects present in the
    # scene for verbosity/robustness testing (e.g. "you can see a Window, a
    # CounterTop, a Chair, and a Fridge"). Named objects must NEVER be paired
    # with a direction, distance, or any relation to the queried object or to
    # each other — naming without relating. This tests tolerance to added scene
    # detail, not distractor resistance; see invisible_displacement
    # difficulty_axis (verbosity) below.
  # EXCEPTION (any construct with duplicate-label objects): the queried
    # object's name may be extended with a disambiguating reference to ONE
    # other, already-unambiguous object (e.g. "the Chair close to the
    # Bread"), when multiple instances of the same category are visible.
    # This is a referring expression, not the tested relation — it must
    # never state the viewer-relative direction being asked about. If no
    # unique disambiguator exists, the object is excluded from query
    # candidates entirely.
  - all spatial facts come from frames + CSV metadata, never from text
  - every item has a non-null answer_source tracing to metadata field(s)
  - frame_of_reference must be unambiguous (stated or fixed by construct)
  - options are real scene locations/directions; exactly one correct
  - distractors are diagnostic: each wrong option = a specific failure mode
  - item enters frozen set only if vision_necessary == true
    (both blind-LLM and caption->LLM baselines FAIL it)

# ============================================================
# CLASS 1 — SPATIAL ENCODING  (all needed info in the current view;
# no delay, no memory, no pose change)
# ============================================================
class_1:
  name: Spatial encoding
  summary: Encode positions/relations that are fully visible now.
  constructs:

    egocentric_encoding:
      class: 1
      frame_of_reference: egocentric
      definition: Relation of a visible object to the VIEWER's current pose.
      what_moves: none
      answer_type: viewer-anchored direction (left/right/ahead/behind/above/below)
      required_temporal_fields: []          # static
      question_template: "From your current view, where is the {object} relative to you?"
      distractor_pattern: [opposite_direction, orthogonal_direction, plausible_wrong_axis]
      discriminators:
        - queried object is VISIBLE in the shown view
        - no delay and no agent movement
        - answer computed from current agent pose + object position
        # FOV constraint: "behind you" cannot be a ground-truth answer (object
        # would be outside the camera); it appears only as a distractor. A zero
        # GT count for behind is expected, not a labeling bug.

    allocentric_encoding:
      class: 1
      frame_of_reference: allocentric
      definition: Relation between two objects in an object-centered frame.
      what_moves: none
      answer_type: object-to-object relation (A left-of/on/inside B)
      required_temporal_fields: []
      question_template: "Relative to the {reference_object}, where is the {object}?"
      distractor_pattern: [opposite_relation, wrong_reference_object, viewer_frame_answer]
      discriminators:
        - all referenced objects VISIBLE in the shown view
        - answer is object-anchored, NOT viewer-anchored
        - reference object's frame (intrinsic front) is defined

# ============================================================
# CLASS 2 — SPATIAL MEMORY  (queried info NOT in current view; held
# across time; the SELF pose is not the thing being transformed)
# ============================================================
class_2:
  name: Spatial memory
  summary: Maintain object identities/locations across time and occlusion.
  constructs:

    spatial_working_memory:
      class: 2
      frame_of_reference: [egocentric, allocentric]
      difficulty_axis: [delay_steps, load_n_objects]
      definition: Recall a previously seen location/relation/count under load and delay.
      what_moves: none            # object is STATIC; difficulty from load + step-depth
      answer_type: recalled relation, location, or count of past-seen items
      required_temporal_fields: [agent_trajectory, agent_actions]  # to define "N steps ago"
      question_template: >-
        Considering what you saw {k} steps ago: where was the {object} relative to you then?
        / How many {objects} have you seen so far?
      distractor_pattern: [current_view_answer, adjacent_step_answer, off_by_one_count]
      discriminators:
        - queried object/relation is NOT in the final view
        - object positions UNCHANGED across shown frames (nothing relocates)
        - delay (k = query_step - encoding_step) and load (n items) are both stated or computable per item, not implicit

    invisible_displacement:
      class: 2
      frame_of_reference: egocentric  # both modes ask ego bearing at query pose
      definition: >
        Track an object's location after it is hidden AND relocated out of view
        (Piaget Stage 6: the move itself is never witnessed, only inferred).
        The question MUST supply a spatial cue naming where the object went
        (destination landmark or partner object's prior place); without that cue
        the item is unanswerable from the frames alone.
      what_moves: object (while hidden)
      difficulty_axis: [delay_steps, load_n_objects, verbosity]  # verbosity:
        concise | verbose — verbose names other static scene objects (no
        relations) per the shared_rules exception; report separately from
        delay/load, don't pool with them
      answer_type:
        - recall_direction: egocentric direction at query pose; question names the destination cue
        - swap: egocentric direction; question names a previously seen partner object as the spatial anchor
      required_temporal_fields:
        [object_state_track, displacement_event, displacement_candidates]
      question_template:
        recall_direction: >-
          While out of view, the {object_type} was moved onto {new_location}.
          Where is it relative to you now?
        swap: >-
          The {object_type} was moved to where the {other_object_type} used to be.
          Where is the {object_type} relative to you now?
      ground_truth_method: >
        Exporter (e.g. SPOC) logs the hidden move plus trial-teleport distractor poses
        (then restores). This repo computes egocentric labels from agent_pose@query_step
        and world poses (chosen / from / candidate positions). Floor destinations are
        checked per-instance, not rejected wholesale: if to_receptacle == Floor,
        search for a nearest_landmark within FLOOR_ANCHOR_RADIUS (default 1.2m,
        calibrate per scene) of the object's true final position; reject only
        that specific candidate if none is found. {new_location} resolves to
        either the receptacle name (non-Floor) or "the floor near the
        {landmark}" (Floor case) — never a bare "Floor" cue. Swap items use a
        distinguishable partner object seen before the swap instead — never
        both cue types in one question. Do not emit receptacle-name-only or
        bare-Floor questions (no destination cue).
      distractor_pattern: [original_location, nearby_receptacle, salient_decoy_location]
      # original_location = A-not-B (from_pos). nearby/salient = trial teleports.
      # Reject if any two options share the same ego label.
      discriminators:
        - queried object was distinguishable, then hidden, before it moved
        - displacement_event.hidden_during == true
        - queried object NOT in nav FOV on any shown frame from move through query_step t
        - one draft item per displacement_events object row (a swap logs two rows → two items)
        - question always names a destination cue (landmark OR partner object)
        - >
          direct move (moved_via != swap): destination cue is distinguishable in
          >=1 shown frame — either the named receptacle (non-Floor) or, for Floor
          destinations, a landmark within FLOOR_ANCHOR_RADIUS of the true final
          position (reject only that Floor candidate if no such landmark exists —
          Floor is no longer excluded as a category); emit recall_direction only
        - >
          swap (moved_via == swap): swap_partner_id set; partner object distinguishable
          in >=1 shown frame at its pre-swap position; emit swap template only (never
          name a receptacle in the question — object anchor OR receptacle anchor, not both)
# ============================================================
# CLASS 3 — OPERATION ON THE COGNITIVE MAP  (answer requires a pose
# DIFFERENT from the encoding pose: real move, or imagined viewpoint)
# ============================================================
class_3:
  name: Operation on the cognitive map
  summary: Transform the self/other viewpoint, then report relations.
  constructs:

    spatial_updating:
      class: 3
      frame_of_reference: egocentric         # bearing at the NEW pose
      definition: Update own position/heading after REAL movement; report a static object's bearing.
      what_moves: observer (real, executed actions)
      answer_type: egocentric direction at the post-move pose
      required_temporal_fields: [agent_trajectory, agent_actions, object_state_track]
      question_template: >-
        Considering the last {k} navigation steps, where is the {object_type} relative to you now?
      ground_truth_method: >
        Net pose change between encode_step and query_step is verified from
        real agent_trajectory positions/headings, never from action count
        alone — a logged action can be a no-op (blocked move, an in-place
        rotation reversed by a later step) and produce no real pose delta.
        Reject the item if position delta AND heading delta between
        agent_pose@encode_step and agent_pose@query_step both fall under a
        minimum tolerance. If two candidate items on the same object share the
        same encode_step and produce an identical computed answer at two
        different query_steps, that signals no real bearing change occurred —
        drop the later one rather than emitting both (this is the exact
        pattern the original house_007514 review flagged on the HousePlant
        pair). Object position confirmed UNCHANGED via object_state, not
        assumed. Bearing recomputed independently from agent_pose@query_step +
        object_position, never trusted from a cached value.
      distractor_pattern: [pre_move_bearing, opposite_turn_bearing, over_rotation_bearing]
      discriminators:
        - object position UNCHANGED (only the agent moves) — confirmed via object_state
        - net pose change (position delta OR heading delta) between encode_step
          and query_step exceeds the calibrated minimum tolerance — action
          count alone is not sufficient evidence of movement
        - queried object NOT visible at the final pose
        - answer computed from agent_pose@final + object_position, recomputed
          independently rather than trusted from any cached field
        - reject duplicate items on the same object/encode_step pair whose
          computed answers are identical across two query_steps

    perspective_taking:
      class: 3
      frame_of_reference: allocentric         # an IMAGINED viewpoint's frame
      definition: >
        Compute a relation from an imagined viewpoint: standing at landmark A,
        facing landmark B (heading = direction A->B), report where a third
        landmark C is. This is the Object Perspective/Spatial Orientation Test
        paradigm (Kozhevnikov & Hegarty, 2001) — heading is defined RELATIONALLY
        by two positions, not by any object's intrinsic front, which removes the
        prior blocker (reference_entity_facing_heading unavailable in AI2-THOR)
        with zero new metadata needed.
      what_moves: observer (imagined; viewpoint adopted, not executed)
      # Difficulty: angle between agent heading and imagined A-facing-B heading (0-180 deg).
      difficulty_axis: [perspective_shift_magnitude]
      answer_type: >
        direction of landmark C from the imagined viewpoint (standing at A, facing B)
      required_temporal_fields: []
      question_template: >-
        Imagine standing at the {A}, facing the {B}. From that position, where is the {C}?
      ground_truth_method: >
        A, B, C are three distinct landmarks, each distinguishable in >=1 shown
        frame (same visibility-grounding standard as every other construct).
        Imagined heading = normalize(pos(B) - pos(A)). Answer = C's position
        transformed into the egocentric frame defined by (pos(A), imagined
        heading) — a standard 2D rotation, computed from real positions only.
      distractor_pattern: [camera_frame_answer, mirrored_left_right, wrong_facing_assumption]
      # camera_frame_answer = C relative to agent's ACTUAL pose (most common shortcut).
      # mirrored_left_right = correct axis, flipped sign (Kozhevnikov & Hegarty, 2001).
      # wrong_facing_assumption = heading toward the wrong reference object.
      discriminators:
        - A, B, C are three distinct landmarks, each distinguishable in >=1 shown frame
        - agent does NOT actually move to viewpoint A (no real action — imagined only)
        - answer is in the imagined (A, A->B heading) frame, never the agent's actual current frame
        - heading is computed relationally from A and B positions — no
          object-intrinsic-front metadata required or used

# ============================================================
# CLASS 4 — NAVIGATION / WAYFINDING  (answer is a multi-step path)
# ============================================================
class_4:
  name: Navigation / wayfinding
  summary: >
    Use acquired environmental spatial knowledge to recall an
    experienced route or infer a novel path to a goal.
  constructs:

    route_knowledge:
      class: 4
      frame_of_reference: egocentric          # procedural, sequential route representation
      definition: Retrace / recall an EXPERIENCED path as an ordered sequence.
      what_moves: observer (along a previously traversed route)
      answer_type: ordered sequence of turns (graded as MCQ over full candidate sequences, not free text)
      required_temporal_fields: [agent_trajectory, agent_actions, nav_graph]
      question_template: "Which of these matches the sequence of turns you made traveling from {source} to {goal}?"
      ground_truth_method: >
        Source/goal are landmarks chosen via select_landmark_candidates()
        (salience-filtered through the visibility classifier, top-N weighted
        sample per region — never nearest-distance, never uniform-random).
        For route_knowledge each landmark is snapped to the nearest *visited*
        nav_graph node via snap_to_nearest_of(graph, pose, traversed_nodes)
        (naming stays on the landmark; pathfinding uses the node). Candidate
        path = the real traversed node sequence between those nodes. Reject
        any candidate below a minimum hop count calibrated per-scene from that
        scene's own distribution of landmark-pair shortest-path lengths
        (capped for MC length) — do not import R2R's 4-6 edge figure as a fixed
        target. Correct answer = derive_turns() on the traversed node sequence,
        binned to episode_meta.agent.rotation_deg, each turn labeled with its
        nearest landmark.
      distractor_pattern: [reversed_sequence, swapped_two_turns, plausible_but_unwalked_route]
      # All three are mechanical perturbations of the real derive_turns()
      # output (order reversal, turn-node reassignment, turn count changed)
      # — never separately hand-authored sequences.
      discriminators:
        - the queried route WAS previously traversed by the agent
        - source and goal are landmarks (region-anchored), never raw graph nodes or arbitrary objects
        - path length >= the scene-calibrated minimum hop count
        - answer requires retrieval of sequential/procedural route information
        - the expected answer preserves the experienced order of turns, actions, or landmarks
        - INVALID if the queried source-goal route was not previously traversed by the agent
        - graded as multiple-choice over full candidate sequences, never free-text
          (keeps scoring deterministic, consistent with the rest of the pipeline)

    survey_based_route_planning:
      class: 4
      frame_of_reference: allocentric          # configurational, map-like representation
      definition: >
        Infer relative direction and distance between observed landmarks using
        survey (layout) knowledge. The graph path linking them must NEVER have
        been traversed — answers are direction/distance judgments, not turn
        sequences (those belong to route_knowledge). A second, conditional
        mode tests flexible replanning under a recorded passage closure
        (Tolman's 1948 blocked-path paradigm).
      what_moves: none required
      answer_type:
        direction_distance: >
          direction + distance of landmark B relative to landmark A
        conditional_detour: >
          initial direction of travel required to reach B from A on the graph
          with the relevant passage's nearby edges removed — NOT the raw static
          bearing; requires re-running shortest_path() on the modified graph
      required_temporal_fields: [agent_trajectory, nav_graph, passage_state]
      question_template:
        direction_distance: >-
          Using your knowledge of the environment's layout,
          where is the {goal} relative to the {source}?
        conditional_detour: >-
          Using your knowledge of the environment's layout, where would you
          first head to reach the {goal} from the {source}, given that {condition}?
      ground_truth_method: >
        Source/goal selected via select_landmark_candidates() and snapped with
        snap_landmark_to_graph() (nearest navigable node). direction_distance
        mode: computed directly from source/goal positions (no path search for
        the label); nav_graph only confirms the path was never traversed.
        conditional_detour mode: {condition} comes from a real recorded
        passage_state closure (never invented); ground truth =
        first_hop_direction_label of shortest_path() on nav_graph after
        remove_edges_near_position(passage).
      distractor_pattern: [opposite_direction, wrong_distance, known_route_answer]
      discriminators:
        - queried path/shortcut is absent from agent_trajectory (never directly traversed)
        - >
          the connection between {source} and {goal} must have been perceptually
          evidenced in some shown frame — the connecting doorway/passage was visible,
          or both regions were visible with a sightline between them — even though
          the agent never walked through it. world_layout.connectivity truth that
          was never perceptually available to the agent is NOT sufficient
        - >
          conditional_detour mode only: {condition} must correspond to a real
          passage_state closure actually recorded in the episode, never an
          invented hypothetical
        - >
          conditional_detour mode only: answer is the modified-graph initial
          direction, never a full turn sequence (that would duplicate route_knowledge)

# ============================================================
# Cross-reference: how construct specifics map onto item schema fields
# (Core fields are always present; these are the construct-dependent ones.)
# ============================================================
schema_hooks:
  object_state_track:
    required_for: [invisible_displacement, spatial_updating]
  displacement_event:
    required_for: [invisible_displacement]
  displacement_candidates:
    required_for: [invisible_displacement]
  agent_trajectory:
    required_for:
      [spatial_working_memory, spatial_updating, route_knowledge, survey_based_route_planning]
  agent_actions:
    required_for: [spatial_working_memory, spatial_updating, route_knowledge]
  nav_graph:
    required_for: [route_knowledge, survey_based_route_planning]
  passage_state:
    required_for: [survey_based_route_planning]
