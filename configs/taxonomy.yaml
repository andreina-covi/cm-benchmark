# taxonomy.yaml — construct definitions for the capability axis.
# This file states *what each construct tests*, not how the generator
# implements it. Implementation: src/cm_benchmark/generation/planner.py
# and docs/generation.md.

version: 0.1
description: >
  Spatial-cognition QA benchmark for VLMs. Four classes, eight
  constructs, treated as a PARTIALLY-ORDERED pipeline (later classes
  subsume earlier ones; they are not fully independent). Frame of
  reference is a CROSS-CUTTING axis, not a construct.

axes:
  capability: {classes: 4, constructs: 8}      # this file
  frame_of_reference: [egocentric, allocentric] # tagged on every item
analysis_breakdowns: [per_construct, "per_construct_x_frame_of_reference"]

# Rules that hold for EVERY construct (enforced by the pipeline, not
# restated in each construct below).
shared_rules:
  - question text names only the queried object(s) and asks the relation;
    it must never state the answer, a direction, or any move/event
  - a question over a frame sequence names its reference frames by number,
    matching the "frame i of n" labels ("in frame 1 (k frames before the last
    frame)", "in the last frame (frame n)"); it never says "now" or "k steps ago"
  # EXCEPTION (spatial_working_memory | invisible_displacement, verbose only):
    # may additionally name other static, non-queried objects present in the
    # scene for verbosity/robustness testing (e.g. "the frames show a Window, a
    # CounterTop, a Chair, and a Fridge"). Named objects must be visible in the
    # item's shown frames, and the preamble never restates the queried object
    # (the question names it), repeats the question, or says how to answer it. Named objects must NEVER be paired
    # with a direction, distance, or any relation to the queried object or to
    # each other — naming without relating. This tests tolerance to added scene
    # detail, not distractor resistance; see invisible_displacement
    # difficulty_axis (verbosity) below.
  # EXCEPTION (any construct with confusable objects): two objects are
    # confusable by the obj-synset rule (same synset, one synset is a
    # hypernym of the other, or they share a direct hypernym). Every named
    # object (queried, ID destination landmark + swap partner, PT A/B/C,
    # class-4 source/goal) is checked across EVERY shown frame. If any two
    # named objects are confusable, the item is rejected. A single confusable
    # object may be extended with either
    # (1) proximity to ONE unique, co-visible landmark ("the Chair close to
    # the Bread") when the 3D AABB gap and 2D pixel-bbox gap are obvious,
    # or (2) a numbered mark on every visible instance of that type
    # ("the Chair marked with the number 2"). This is a referring
    # expression, not the tested relation — it must never use a
    # landmark-relative direction ("left of the Bread"). If neither
    # proximity nor a mark is available, the object is excluded.
  - all spatial facts come from frames + CSV metadata, never from text
  - every item has a non-null answer_source tracing to metadata field(s)
  - frame_of_reference must be unambiguous (stated or fixed by construct)
  - >-
    options are real scene locations/directions; exactly one correct
    (class-4 options are whole landmark-and-turn routes with the same steps
    and landmarks; exactly one matches the reference walk)
  - >-
    distractors are diagnostic: each wrong option = a specific failure mode
  - item enters frozen set only if vision_necessary == true
    (both blind-LLM and caption->LLM baselines FAIL it)

# ============================================================
# CLASS 1 — SPATIAL ENCODING  (all needed info in the current view;
# no delay, no memory, no pose change)
# ============================================================
class_1:
  name: Spatial encoding
  summary: Encode positions/relations that are fully visible now.
  constructs:

    egocentric_encoding:
      class: 1
      frame_of_reference: egocentric
      definition: Relation of a visible object to the viewer's current pose.
      what_moves: none
      answer_type: viewer-anchored direction (left / right / ahead / behind only)
      required_temporal_fields: []
      question_template: "From your current view, where is the {object} relative to you?"
      ground_truth_method: >
        Bearing of a visible object from the current agent pose.
        "Behind you" cannot be the ground-truth answer (FOV); only a distractor.
      distractor_pattern: [opposite_direction, orthogonal_direction, plausible_wrong_axis]
      discriminators:
        - queried object is visible in the shown view
        - no delay and no agent movement
        - answer from current pose + object position

    allocentric_encoding:
      class: 1
      frame_of_reference: allocentric
      definition: Relation between two objects in an object-centered frame.
      what_moves: none
      answer_type: object-to-object relation (A left-of/on/inside B)
      required_temporal_fields: []
      question_template: "Relative to the {reference_object}, where is the {object}?"
      ground_truth_method: >
        Object-to-object relation in the reference object's frame.
        Unsupported until trusted object facing exists.
      distractor_pattern: [opposite_relation, wrong_reference_object, viewer_frame_answer]
      discriminators:
        - all referenced objects visible in the shown view
        - answer is object-anchored, not viewer-anchored
        - reference object's intrinsic front is defined

# ============================================================
# CLASS 2 — SPATIAL MEMORY  (queried info NOT in current view; held
# across time; the SELF pose is not the thing being transformed)
# ============================================================
class_2:
  name: Spatial memory
  summary: Maintain object identities/locations across time and occlusion.
  constructs:

    spatial_working_memory:
      class: 2
      frame_of_reference: [egocentric, allocentric]
      difficulty_axis: [delay_steps, load_n_objects]
      definition: Recall a previously seen location, relation, or count under load and delay.
      what_moves: none
      answer_type: recalled relation, location, or count of past-seen items
      required_temporal_fields: [agent_trajectory, agent_actions]
      question_template: >-
        Where was the {object_type}{disambiguator} relative to you in frame {enc_frame} ({k} frames before the last frame)?
        / Across frames {enc_frame} to {last_frame}, how many distinct {objects} have you seen?
      ground_truth_method: >
        Recalled relation, location, or count from the encoding step.
        The object is static; the queried info is gone from the final view.
      distractor_pattern: [current_view_answer, adjacent_step_answer, off_by_one_count]
      discriminators:
        - queried object/relation is not in the final view
        - object positions unchanged (nothing relocates)
        - delay k and load n are explicit per item

    invisible_displacement:
      class: 2
      frame_of_reference: egocentric  # both modes ask ego bearing at query pose
      definition: >
        Track an object after it is hidden and relocated out of view.
        The question names where it went (landmark or swap partner).
      what_moves: object (while hidden)
      # verbosity: concise | verbose — verbose names other static scene objects
      # (no relations) per the shared_rules exception; report separately from
      # delay/load, don't pool with them.
      difficulty_axis: [delay_steps, load_n_objects, verbosity]
      answer_type:
        - recall_direction: egocentric direction at query pose; question names the destination cue
        - swap: egocentric direction; question names a previously seen partner object as the spatial anchor
      required_temporal_fields:
        [object_state_track, placement_candidates]
      question_template:
        recall_direction: >-
          While out of view, the {object_type} was moved onto {new_location}.
          Where is it relative to you in the last frame (frame {last_frame})?
        swap: >-
          The {object_type} was moved to where the {other_object_type} used to be.
          Where is the {object_type} relative to you in the last frame (frame {last_frame})?
      ground_truth_method: >
        Built from successful placement_candidates. The move step is the
        latest frame in (encode, query] at which the object is hidden.
        A receptacle destination is kept only when parent_receptacle equals
        the anchor id. Answer is the object's egocentric bearing at the
        query pose (left / right / ahead / behind). Floor destinations need
        a nearby named landmark ("the floor near the {landmark}"), never a
        bare Floor. Swap items name a previously seen partner object instead
        of a receptacle. A swap partner must be pickupable. When the
        destination anchor is a non-pickupable receptacle the question uses
        recall_direction ("moved onto the {anchor}") and is never a swap.
        swap_partner_ok applies only to swaps.
      distractor_pattern: [original_location, nearby_receptacle, salient_decoy_location]
      discriminators:
        - queried object was distinguishable, then hidden, then moved
        - the move itself is never visible
        - question names a destination cue (landmark or swap partner)
# ============================================================
# CLASS 3 — OPERATION ON THE COGNITIVE MAP  (answer requires a pose
# DIFFERENT from the encoding pose: real move, or imagined viewpoint)
# ============================================================
class_3:
  name: Operation on the cognitive map
  summary: Transform the self/other viewpoint, then report relations.
  constructs:

    spatial_updating:
      class: 3
      frame_of_reference: egocentric         # bearing at the NEW pose
      definition: Update own position/heading after REAL movement; report a static object's bearing.
      what_moves: observer (real, executed actions)
      answer_type: egocentric direction at the post-move pose
      required_temporal_fields: [agent_trajectory, agent_actions, object_state_track]
      question_template: >-
        The {object_type} is in view in frame {enc_frame}. Where is it relative to you in the last frame (frame {last_frame})?
      ground_truth_method: >
        Confirm a real pose change (position or heading) between encode and
        query — not action count alone. Object stays put (object_state_track).
        Answer is the object's bearing at the new pose.
      distractor_pattern: [pre_move_bearing, opposite_turn_bearing, over_rotation_bearing]
      discriminators:
        - object position unchanged (only the agent moves)
        - net pose change between encode and query — action count is not enough
        - queried object not visible at the final pose
        - answer recomputed from the final pose + object position

    perspective_taking:
      class: 3
      frame_of_reference: allocentric         # an IMAGINED viewpoint's frame
      definition: >
        Standing next to floor-standing landmark A, facing B, report where landmark C is.
        Heading is A→B (two positions), not an object's intrinsic front.
      what_moves: observer (imagined; viewpoint adopted, not executed)
      # Difficulty: angular disparity between the camera heading and the imagined
      # A-facing-B heading (0-180 deg), binned by perspective_taking.disparity_bin_edges_deg
      # (item `difficulty`). Pair distance is only a well-definedness gate.
      difficulty_axis: [perspective_shift_magnitude]
      answer_type: >
        direction of landmark C from the imagined viewpoint (standing at A, facing B)
      required_temporal_fields: []
      question_template: >-
        Imagine standing next to the {A}, facing the {B}. From that position, where is the {C}?
      ground_truth_method: >
        Three distinguishable landmarks A, B, C. Imagined heading is A→B.
        Answer is where C sits in that frame (ahead / left / right / behind: the
        same four 90-deg sectors as spatial updating, 10-deg margin on every edge),
        stable over every point of A's grown box, B's box and C's box.
        No object-intrinsic facing is required.
      distractor_pattern: [camera_frame_answer, mirrored_left_right, wrong_facing_assumption]
      discriminators:
        - A, B, and C are distinguishable in the shown frames (together in one frame,
          or across the frames of one short window when perspective_taking.multi_frame)
        - agent does NOT actually move to viewpoint A (no real action — imagined only)
        - answer is in the imagined (A, A->B heading) frame, never the agent's actual current frame
        - heading is computed relationally from A and B positions — no
          object-intrinsic-front metadata required or used

# ============================================================
# CLASS 4 — NAVIGATION / WAYFINDING  (answer is a multi-step path)
# ============================================================
class_4:
  name: Navigation / wayfinding
  summary: >
    Use acquired environmental spatial knowledge to recall an
    experienced route or infer a novel path to a goal.
  constructs:

    route_knowledge:
      class: 4
      frame_of_reference: egocentric
      definition: Retrace an experienced path as an ordered landmark-and-turn route.
      what_moves: observer (along a previously traversed route)
      answer_type: >
        MCQ over whole routes ("walk ahead, turn left, walk to the sofa, turn
        right, walk to the end point") on a stretch of the walk with 2 to 4
        labelled turns (class4.mc). Turn runs merge within
        class4.mc.turn_merge_m and are labelled left/right/turn around past
        class4.mc.turn_edges_deg with directions.label_margin_deg (a lone 45°
        correction is no turn, 135° is ambiguous and rejects the stretch).
        Each turn is named by the nearest clearly seen object that never
        moves (not pickupable, not moveable) within
        class4.mc.turn_landmark_max_m, duplicates by proximity or a numbered
        mark; otherwise "walk ahead". At least one turn is named. Options are
        a 2x2 design {correct, X, Y, X+Y} of two single changes at different
        steps; X+Y is tagged with both. Exact option match. A small
        free-action diagnostic subset (landmark pairs, replay-scored success /
        SPL / SDTW, diagnostic_subset: free_action) is reported descriptively.
      required_temporal_fields: [agent_trajectory, nav_graph]
      question_template: >
        Start at your position in frame {i}, facing as in frame {i}.
        The end point is your position in frame {j}. Which route retraces
        the walk you took from the start to the end point?
      ground_truth_method: >
        Multiple choice: for each run of 2-4 consecutive labelled turns of the
        recorded walk (glances dropped), the stretch runs from after the
        previous turn to before the next one, trimmed evenly to
        max(frames.budgets) frames; every frame is shown, so {i} = 1 and
        {j} = the last frame. The recorded actions replayed from the start
        pose must end within goal_success_m of the end pose. No landmark-pair
        gates. The free-action subset keeps the pair method below:
        Source and goal are floor-standing landmarks on the walked trajectory.
        They are not confusable with each other. {i} / {j} (aliases
        {source_frame} / {goal_frame}) are 1-based indices into the shown
        frames (same numbering as the images): source = first distinguishable
        sighting of the source; goal = the goal sighting whose agent pose is
        the scorer target. Marks and proximity phrases stay in {source}/{goal}
        when endpoints are disambiguated; the template supplies the article.
        The stored reference is the agent's recorded actions between those
        sightings. Replay starts at the source-sighting pose. A move that
        lands farther than the calibrated block tolerance from every
        reachable node is a no-op. Success is the final position within
        goal_success_m of the goal-sighting pose. The landmark centroid
        is not that pose. nDTW compares the replayed and reference pose
        sequences with d_th = goal_success_m; SDTW = success × nDTW
        (headline). Edge-membership validity is logged only.
        Keep only non-trivial walks (at least 2 m, detour, and at least
        one real turn). There is no scene-percentile length gate. A scene
        with no such walk is unsupported. The answer is the route text of
        those recorded actions (see answer_type); the replay stays stored
        (action_sequence) for diagnostics.
      distractor_pattern:
        - mirrored_turn (one turn flipped left <-> right; one step)
        - swapped_landmarks (two turn slots trade landmarks; one may be unnamed)
      discriminators:
        - the queried route was previously traversed (path on traversed_edges)
        - source and goal are named landmarks, not graph nodes
        - the walk is non-trivial (not a short straight shot)
        - every option has the same legs and landmarks; only turns or order differ
        - INVALID if that source–goal walk was not previously traversed

    survey_based_route_planning:
      class: 4
      frame_of_reference: allocentric
      definition: >
        Plan a never-walked source→goal using layout knowledge from what was
        seen, not a walked route.
      what_moves: none required
      answer_type: >
        MCQ over whole landmark-and-turn routes, built from the continuous
        BFS reference of a never-walked landmark pair exactly as
        route_knowledge builds them from the recorded actions (class4.mc,
        2x2 options). Exact option match. The same pairs also give the
        free-action diagnostic subset (replay-scored success / SPL).
      required_temporal_fields: [agent_trajectory, nav_graph]
      question_template: >
        Start at your position in frame {i}, facing as in frame {i}
        (the {source} is in view). The end point is your position in frame {j}
        (the {goal} is in view). You never walked this way. Using what you have
        seen of the layout, which route leads from the start to the end point?
      ground_truth_method: >
        Source and goal are floor-standing landmarks with no path on
        traversed_edges and a path on viewed_edges. They are not confusable
        with each other. {i} / {j} (aliases {source_frame} / {goal_frame})
        are 1-based indices into the shown frames: source = first
        distinguishable sighting of the source; goal = the goal sighting
        whose agent pose is the scorer target. Marks and proximity phrases
        stay in {source}/{goal} when endpoints are disambiguated; the
        template supplies the article. The stored reference is a continuous
        BFS from the source-sighting pose over those viewed moves, not the
        agent's recorded actions. Success is the final position within
        goal_success_m of the goal-sighting pose, the same target as
        route_knowledge (headline). SPL is given success. Edge-membership
        validity is diagnostic only. Keep only non-trivial pairs (at least
        2 m and at least one real turn); emit the hardest surviving ones.
      distractor_pattern:
        - mirrored_turn (one turn flipped left <-> right; one step)
        - swapped_landmarks (two turn slots trade landmarks; one may be unnamed)
      discriminators:
        - queried path was never walked (absent from traversed_edges)
        - a path exists on viewed_edges (answerable from what was seen)
        - agent is not standing at the source when it is first sighted
        - the planned walk is non-trivial
        - every option has the same legs and landmarks; only turns or order differ
# ============================================================
# Cross-reference: how construct specifics map onto item schema fields
# (Core fields are always present; these are the construct-dependent ones.)
# ============================================================
schema_hooks:
  object_state_track:
    required_for: [invisible_displacement, spatial_updating]
  displacement_event:
    required_for: [invisible_displacement]
  placement_candidates:
    required_for: [invisible_displacement]
  agent_trajectory:
    required_for:
      [spatial_working_memory, spatial_updating, route_knowledge, survey_based_route_planning]
  agent_actions:
    required_for: [spatial_working_memory, spatial_updating]
  nav_graph:
    required_for: [route_knowledge, survey_based_route_planning]
