# Large runs: no item caps and no answer-label trim. Every item that passes
# the quality gates is kept (merged onto generation.yaml by --config).
# Balance answer labels later, when sampling an evaluation split.
name: max

budget:
  max_per_construct: null  # no cap
  max_per_scene: null  # no cap
  candidate_pool: null  # no cap: planners return every fact that passes the gates

options:
  max_label_share: 1.0  # no label trim
